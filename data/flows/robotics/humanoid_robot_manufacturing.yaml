- [humanoid_robot, basis, act_integrate_wheeled_arm_robot]
- [act_integrate_wheeled_arm_robot, ref, integration_of_wheeled_arm_robot]
- [act_integrate_wheeled_arm_robot, primary_result, wheeled_arm_robot]
