- [bioreactor, tool, act_t_cell_expansion]
- [act_t_cell_expansion, ref, cell_culture_process]
- [act_t_cell_expansion, intermediate, expanded_engineered_t_cell]
- [expanded_engineered_t_cell, feedstock, act_cell_therapy_fill_finish]
- [act_cell_therapy_fill_finish, ref, fill_finish_process]
- [act_cell_therapy_fill_finish, primary_result, cell_therapy_product]
- [act_t_cell_transduction, next, act_t_cell_expansion]
- [act_t_cell_expansion, next, act_cell_therapy_fill_finish]
